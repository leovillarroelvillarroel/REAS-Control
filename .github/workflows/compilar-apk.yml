name: Compilar APK Android REAS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compilar-apk.yml'
  workflow_dispatch:

concurrency:
  group: reas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Reconstruir y verificar proyecto
        shell: bash
        run: |
          cat bundle/{01,02,03,04,05,06}.b64 | base64 --decode > reas_sources.tar.xz
          echo "d1a464a23daf2381e1aaa000b240433d2d0fbc464236f4ca60cc2492aa06f528  reas_sources.tar.xz" | sha256sum --check
          tar -xJf reas_sources.tar.xz
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/cl/fusat/reas/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/cl/fusat/reas/PdfSupport.java")
          s = p.read_text()
          assert "7.1,false,DARK" in s and "6.5,true,DARK" in s
          s = s.replace("7.1,false,DARK", "7.1f,false,DARK").replace("6.5,true,DARK", "6.5f,true,DARK")
          p.write_text(s)
          PY
          base64 --decode patches/REAS_UI_v2.py.xz.b64 | xz --decompress > /tmp/REAS_UI_v2.py
          python3 /tmp/REAS_UI_v2.py
          grep -q 'android:label="REAS"' app/src/main/AndroidManifest.xml
          grep -q 'versionCode 2' app/build.gradle
          test -f app/src/main/res/drawable/ic_reas.xml
          cat patches/v12/{01,02,03,04,05}.b64 | base64 --decode > /tmp/reas_v12.diff.xz
          echo "5a1f7d3ec2b7b4669cbdb5cf61e288fbf020aaddeb7417b766aa2db6e289157b  /tmp/reas_v12.diff.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v12.diff.xz | patch --batch -p1
          sed -i "s/versionCode 2/versionCode 3/; s/versionName '1.1'/versionName '1.2'/" app/build.gradle
          grep -q 'VERSION = 2' app/src/main/java/cl/fusat/reas/Db.java
          grep -q 'versionCode 3' app/build.gradle
          cat patches/v121.b64 | base64 --decode > /tmp/reas_v121.diff.xz
          echo "6d9c5fb6e017bf61e48ddcb5c0692ce2b517e0d70a977020092235fe20a89490  /tmp/reas_v121.diff.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v121.diff.xz | patch --batch -p1
          sed -i "s/versionCode 3/versionCode 4/; s/versionName '1.2'/versionName '1.2.1'/" app/build.gradle
          grep -q 'versionCode 4' app/build.gradle
          test -f app/src/main/java/cl/fusat/reas/BackupImporter.java
          base64 --decode patches/v13_layout.diff.xz.b64 > /tmp/reas_v13_layout.diff.xz
          echo "57a7fd44662c4d898d0b1c0c0239ce8528c5b9a0bdd4742b25644b87764f8c31  /tmp/reas_v13_layout.diff.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v13_layout.diff.xz | patch --batch -p1
          sed -i "s/versionCode 4/versionCode 5/; s/versionName '1.2.1'/versionName '1.3'/" app/build.gradle
          grep -q 'versionCode 5' app/build.gradle
          grep -q 'addTab(tabs,"Especiales"' app/src/main/java/cl/fusat/reas/MainActivity.java
          grep -q 'TAB_YELLOW' app/src/main/java/cl/fusat/reas/MainActivity.java
          grep -q 'TAB_RED' app/src/main/java/cl/fusat/reas/MainActivity.java
          ! grep -q 'Ingresa la procedencia del residuo' app/src/main/java/cl/fusat/reas/MainActivity.java
          ! grep -q 'e.origin.isEmpty()' app/src/main/java/cl/fusat/reas/BackupImporter.java

          cat patches/v14/{01,02,03,04}.b64 | base64 --decode > /tmp/reas_v14.diff.xz
          echo "d59fc8b57c2c4023ab7b7a5a64e66ccf3b8bc52afc27292a87e82afa070c758c  /tmp/reas_v14.diff.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v14.diff.xz | patch --batch -p1
          sed -i "s/versionCode 5/versionCode 6/; s/versionName '1.3'/versionName '1.4'/" app/build.gradle
          grep -q 'versionCode 6' app/build.gradle
          test -f app/src/main/java/cl/fusat/reas/Special.java
          grep -q 'Special.TYPES.length' app/src/main/java/cl/fusat/reas/MainActivity.java
          grep -q 'VERSION = 3' app/src/main/java/cl/fusat/reas/Db.java
          cat patches/v15/{01,02,03}.b64 | base64 --decode > /tmp/reas_v15.diff.xz
          echo "4ef4fd5a6655f352d359ebce4cd01c8fc9e05f183f095cbeb41f94eed06413e8  /tmp/reas_v15.diff.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v15.diff.xz | patch --batch -p1
          python3 - <<'PY'
          from pathlib import Path
          path=Path("app/src/main/java/cl/fusat/reas/MainActivity.java")
          s=path.read_text()
          duplicate="    private static double grossView(double storedNet,int mask,int bit) {return storedNet+((mask&bit)!=0?8:0);}"+"\n"
          assert s.count(duplicate)==1, "No se encontró método antiguo duplicado"
          path.write_text(s.replace(duplicate,"",1))
          PY
          sed -i "s/versionCode 6/versionCode 7/; s/versionName '1.4'/versionName '1.5'/" app/build.gradle
          test -f app/src/main/java/cl/fusat/reas/WeightPolicy.java
          grep -q 'VERSION = 4' app/src/main/java/cl/fusat/reas/Db.java
          grep -q 'versionCode 7' app/build.gradle
          base64 --decode patches/v16_peso_unico_zoom.diff.xz.b64 > /tmp/reas_v16.diff.xz
          echo "ce489956554d39fc854550bf8f6ea8615772f1d89e3a8a9e522fba116b81bdfe  /tmp/reas_v16.diff.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v16.diff.xz | patch --batch -p1
          grep -q 'versionCode 8' app/build.gradle
          grep -q 'VERSION = 5' app/src/main/java/cl/fusat/reas/Db.java
          grep -q 'Zoom +' app/src/main/java/cl/fusat/reas/PdfPreviewActivity.java
          grep -q 'KILOS TOTALES BRUTOS DEL CONTENEDOR' app/src/main/java/cl/fusat/reas/MainActivity.java
          ! grep -q 'input("Peoneta"' app/src/main/java/cl/fusat/reas/MainActivity.java
          ! grep -q 'input("Patente' app/src/main/java/cl/fusat/reas/MainActivity.java
          grep -q 'new String\[\]{"Sólido","Líquido"}' app/src/main/java/cl/fusat/reas/MainActivity.java
          cat patches/v17/{01,02,03,04,05}.b64 | base64 --decode > /tmp/reas_v17.patch.xz
          echo "c940e632d9eda1e63c5c9a57bec2eb96b1df762818e75bc8b4e3276723d8d104  /tmp/reas_v17.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v17.patch.xz | patch --batch -p1
          grep -q 'versionCode 9' app/build.gradle
          grep -q 'versionName ' app/build.gradle
          grep -q 'weekKey(' app/src/main/java/cl/fusat/reas/XlsxExporter.java
          grep -q 'REAS · RESUMEN ' app/src/main/java/cl/fusat/reas/PdfSupport.java
          grep -q 'historyCategory(' app/src/main/java/cl/fusat/reas/MainActivity.java
          base64 --decode patches/v18_split_kg_pilas.diff.xz.b64 > /tmp/reas_v18.patch.xz
          echo "79e1d4e4a6f4e38be0474511cb7b569bc0b1a135eca8525cdff3d0e8af3ef3ec  /tmp/reas_v18.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v18.patch.xz | patch --batch -p1
          grep -q 'versionCode 10' app/build.gradle
          grep -q "versionName '1.8'" app/build.gradle
          grep -q 'VERSION = 6' app/src/main/java/cl/fusat/reas/Db.java
          grep -q '"Pilas"' app/src/main/java/cl/fusat/reas/Hazard.java
          grep -q 'dailyReceipt(' app/src/main/java/cl/fusat/reas/PdfSupport.java
          grep -q '"Kg bolsas"' app/src/main/java/cl/fusat/reas/XlsxExporter.java
          grep -q '"Kg cajas"' app/src/main/java/cl/fusat/reas/XlsxExporter.java
          test -f app/src/main/java/cl/fusat/reas/WeightPolicy.java



      - name: Preparar archivo fuente para revision
        shell: bash
        run: |
          tar -czf /tmp/REAS_Fuentes_v1.8.tar.gz app build.gradle settings.gradle gradle.properties

      - name: Publicar archivo fuente para revision
        uses: actions/upload-artifact@v4
        with:
          name: REAS-Fuentes-v1.8
          path: /tmp/REAS_Fuentes_v1.8.tar.gz
          if-no-files-found: error
          retention-days: 3


      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK y API 35
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK instalable
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Comprobar APK generado
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: REAS-Control-APK-Instalable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Publicar APK directo en el repositorio
        shell: bash
        run: |
          mkdir -p descargas
          cp app/build/outputs/apk/debug/app-debug.apk descargas/REAS-Control.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/REAS-Control.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publicar APK instalable REAS Control"
            git push origin HEAD:main
          fi

