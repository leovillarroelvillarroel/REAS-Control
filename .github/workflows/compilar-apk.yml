name: Compilar APK Android REAS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Reconstruir y verificar proyecto
        shell: bash
        run: |
          cat bundle/{01,02,03,04,05,06}.b64 | base64 --decode > reas_sources.tar.xz
          echo "d1a464a23daf2381e1aaa000b240433d2d0fbc464236f4ca60cc2492aa06f528  reas_sources.tar.xz" | sha256sum --check
          tar -xJf reas_sources.tar.xz
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/cl/fusat/reas/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/cl/fusat/reas/PdfSupport.java")
          s = p.read_text()
          assert "7.1,false,DARK" in s and "6.5,true,DARK" in s
          s = s.replace("7.1,false,DARK", "7.1f,false,DARK").replace("6.5,true,DARK", "6.5f,true,DARK")
          p.write_text(s)
          PY
          base64 --decode patches/REAS_UI_v2.py.xz.b64 | xz --decompress > /tmp/REAS_UI_v2.py
          python3 /tmp/REAS_UI_v2.py
          grep -q 'android:label="REAS"' app/src/main/AndroidManifest.xml
          grep -q 'versionCode 2' app/build.gradle
          test -f app/src/main/res/drawable/ic_reas.xml
          cat patches/v12/{01,02,03,04,05}.b64 | base64 --decode > /tmp/reas_v12.diff.xz
          echo "5a1f7d3ec2b7b4669cbdb5cf61e288fbf020aaddeb7417b766aa2db6e289157b  /tmp/reas_v12.diff.xz" | sha256sum --check
          xz --decompress --stdout /tmp/reas_v12.diff.xz | patch --batch -p1
          sed -i "s/versionCode 2/versionCode 3/; s/versionName '1.1'/versionName '1.2'/" app/build.gradle
          grep -q 'VERSION = 2' app/src/main/java/cl/fusat/reas/Db.java
          grep -q 'versionCode 3' app/build.gradle
      - name: Preparar archivo fuente para revision
        shell: bash
        run: |
          tar -czf /tmp/REAS_Fuentes_v1.2.tar.gz app build.gradle settings.gradle gradle.properties

      - name: Publicar archivo fuente para revision
        uses: actions/upload-artifact@v4
        with:
          name: REAS-Fuentes-v1.2
          path: /tmp/REAS_Fuentes_v1.2.tar.gz
          if-no-files-found: error
          retention-days: 3


      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK y API 35
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK instalable
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Comprobar APK generado
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: REAS-Control-APK-Instalable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Publicar APK directo en el repositorio
        shell: bash
        run: |
          mkdir -p descargas
          cp app/build/outputs/apk/debug/app-debug.apk descargas/REAS-Control.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/REAS-Control.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publicar APK instalable REAS Control"
            git push origin HEAD:main
          fi

